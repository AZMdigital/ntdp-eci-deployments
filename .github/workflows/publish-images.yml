
      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPO"

          echo "Available releases:"
          gh release list --repo "$GH_REPO"

          mkdir -p images

          gh release download images-v1 \
            --repo "$GH_REPO" \
            --dir images \
            --pattern "*.tar"

          echo "Downloaded files:"
          ls -lh images/

          test -f images/chatbot-frontend.tar
          test -f images/ntdp_chatbot_backend.tar
