
      - name: Download latest release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPO"

          RELEASE_TAG=$(gh release view \
            --repo "$GH_REPO" \
            --json tagName \
            --jq '.tagName')

          echo "Latest release: $RELEASE_TAG"

          mkdir -p images

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --dir images \
            --pattern "*.tar"

          echo "Downloaded files:"
          ls -lh images/

          test -f images/chatbot-frontend.tar
          test -f images/ntdp_chatbot_backend.tar
